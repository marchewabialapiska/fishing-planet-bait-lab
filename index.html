 <div class="row" style="margin-top:16px"><button class="btn gold" id="confirm-plan">✓ Zatwierdź zużycie całego planu</button><button class="btn ghost" id="clear-plan">Wyczyść cały plan</button></div>
 </section>
 <section class="panel"><div class="panelhead"><div><h2>Lista składników dla planu</h2><p class="muted">Sumaryczne zapotrzebowanie na wszystkie opcje zanęty ze wszystkich wypraw.</p></div></div>${needs?table(["Składnik","Potrzeba","Masz","Kontrola"],needs):'<div class="empty">Wybierz recepturę, aby obliczyć zapotrzebowanie.</div>'}</section>
 <section class="panel"><div class="panelhead"><div><h2>Lista zakupów na wyprawę</h2><p class="muted">Tylko brakujące składniki. Sprawdź kupione pozycje, wpisz faktycznie kupioną ilość i zatwierdź, aby dodać ją do magazynu.</p></div><span class="status ${shoppingMissing.length?"bad":"ok"}">${shoppingMissing.length?`${shoppingMissing.length} braków`:"Komplet składników"}</span></div>
 ${shoppingRows?table(["Składnik","Potrzeba","Masz","Brakuje","Dodaj do magazynu (g)","Kupione"],shoppingRows):'<div class="empty">Na ten moment niczego nie brakuje — wybierz receptury i liczbę porcji powyżej.</div>'}
 ${shoppingRows?`<div class="row" style="margin-top:16px"><button class="btn gold" id="confirm-shopping">✓ Dodaj kupione do magazynu</button><button class="btn ghost" id="sync-shopping-amounts">↻ Ustaw ilości według aktualnych braków</button><button class="btn ghost" id="reset-shopping-checks">Wyczyść odhaczenia</button></div><p class="muted" style="margin-top:10px">Lista braków aktualizuje się z planu i magazynu. Przycisk „Ustaw ilości…” ponownie wpisuje aktualnie brakujące gramatury. Magazyn i historia zmieniają się dopiero po zatwierdzeniu zakupów.</p>`:""}</section>`;
}
function stockPage(){

   <div class="row" style="margin-top:12px"><button class="btn" type="button" id="add-recipe-new-product">＋ Dodaj do receptury i magazynu</button></div>
  </div>
  <div class="row" style="margin-top:14px"><button class="btn gold" type="submit">Zapisz recepturę</button><button class="btn ghost" type="button" id="recipe-cancel">Wyczyść formularz</button></div>
 </form>
 <div class="recipegrid">${cards||'<div class="empty">Brak receptur. Dodaj pierwszą powyżej.</div>'}</div></section>`;
}
function buyPage(){
 return `<section class="panel"><div class="panelhead"><div><h2>Dodaj zakup do magazynu</h2><p class="muted">Zapisany zakup zwiększa stan składnika i trafia do historii.</p></div></div><form id="buy-form"><div class="grid2"><label class="field">Produkt<select id="buy-ingredient" required>${allIngredients().map(k=>`<option>${esc(k)}</option>`).join("")}</select><span class="muted">Nie ma produktu? Dodaj go w zakładce Magazyn.</span></label><label class="field">Kupiona ilość (g)<input id="buy-grams" type="number" min="1" step="1" required placeholder="np. 500"></label><label class="field">Cena (opcjonalnie)<input id="buy-price" type="number" min="0" step=".01" placeholder="np. 4,99"></label><label class="field">Sklep / notatka<input id="buy-note" type="text" placeholder="np. zapas na weekend"></label></div><div class="row" style="margin-top:16px"><button class="btn gold" type="submit">＋ Zapisz zakup i uzupełnij magazyn</button></div></form></section>

function historyPage(){
 let rows=state.history.slice().reverse().map(h=>`<tr><td>${esc(h.date)}</td><td><span class="status ${h.type==="Zużycie"?"warn":"ok"}">${esc(h.type)}</span></td><td>${esc(h.description||"—")}</td><td>${esc(h.ingredient||"—")}</td><td>${h.type==="Zakup"?"+":"−"}${fmt(h.grams)} g</td><td>${esc(h.details||"—")}</td></tr>`).join("");
 return `<section class="panel"><div class="panelhead"><div><h2>Dziennik dnia</h2><p class="muted">Wyczyść dziennik i listę ostatnich zakupów po zakończeniu dnia. To usuwa wyłącznie zapisy — nie zmienia stanów magazynowych.</p></div><div class="row"><button class="btn ghost" id="export-history">Eksportuj CSV</button><button class="btn danger" id="clear-history">Wyczyść historię</button></div></div>
 <div class="notice">„Wyczyść historię” usuwa wpisy dziennika i listę ostatnich zakupów. Nie cofa zakupów, nie dodaje z powrotem zużytych składników i nie zmienia magazynu.</div>
 ${rows?table(["Data i godzina","Typ","Opis / wyprawa","Składnik","Ilość","Szczegóły"],rows):'<div class="empty">Dziennik jest pusty. Zakupy i zużycie będą tu zapisywane, gdy wykonasz operacje.</div>'}</section>`;
}
function addRecipeIngredientRow(selected="", grams=""){
 const wrap=$("#recipe-ingredient-rows");if(!wrap)return;
 const row=document.createElement("div");row.className="ingredient-editor-row recipe-ingredient-row";
 const options=allIngredients().map(k=>`<option value="${esc(k)}" ${k===selected?"selected":""}>${esc(k)}</option>`).join("");
 row.innerHTML=`<label class="field">Produkt<select class="recipe-row-product" required><option value="">— wybierz z magazynu —</option>${options}</select></label><label class="field">Gramatura (g)<input class="recipe-row-grams" type="number" min="0.1" step="0.1" value="${esc(grams)}" required placeholder="np. 250"></label><button type="button" class="btn danger recipe-row-remove">Usuń</button>`;
 row.querySelector(".recipe-row-remove").onclick=()=>row.remove();wrap.appendChild(row);
}
function clearRecipeEditor(){const original=$("#recipe-original");if(!original)return;original.value="";$("#recipe-name").value="";$("#recipe-ingredient-rows").innerHTML="";$("#recipe-form-title").textContent="＋ Dodaj / edytuj recepturę";$("#recipe-new-product").value="";$("#recipe-new-grams").value="";addRecipeIngredientRow();}
function render(){nav();let fn={"start":startPage,"plan":planPage,"stock":stockPage,"recipes":recipesPage,"buy":buyPage,"history":historyPage}[page];$("#content").innerHTML=fn();if(page==="recipes"&&!$("#recipe-ingredient-rows").children.length)addRecipeIngredientRow();bind();}
function bind(){
 document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{page=b.dataset.go;render();});
 document.querySelectorAll("[data-plan-recipe]").forEach(el=>el.onchange=()=>{state.plan[+el.dataset.planRecipe].recipe=el.value;save();render();});
 document.querySelectorAll("[data-plan-portions]").forEach(el=>el.onchange=()=>{state.plan[+el.dataset.planPortions].portions=Math.max(0,Number(el.value)||0);save();render();});
 document.querySelectorAll("[data-remove-plan]").forEach(el=>el.onclick=()=>{state.plan.splice(+el.dataset.removePlan,1);save();render();});
 $("#add-plan")?.addEventListener("click",()=>{const base="Nowa wyprawa";let name=base,n=2;while(state.plan.some(p=>(p.trip||"").trim()===name)){name=`${base} ${n++}`;}state.plan.push({recipe:"",portions:1,trip:name,venue:"",customVenue:"",notes:""});save();render();});
 $("#clear-plan")?.addEventListener("click",()=>{if(confirm("Wyczyścić wszystkie pozycje planu? Magazyn nie zostanie zmieniony.")){state.plan=[];save();render();}});
 document.querySelectorAll("[data-group-trip]").forEach(el=>el.onchange=()=>{const gi=+el.dataset.groupTrip;const groups=[...new Set(state.plan.map(p=>(p.trip||"").trim()||"__bez_nazwy__"))];const old=groups[gi],name=el.value.trim();if(!name){alert("Podaj nazwę wyprawy.");render();return;}if(name!==old&&state.plan.some(p=>(p.trip||"").trim()===name)){alert("Wyprawa o tej nazwie już istnieje. Użyj innej nazwy.");render();return;}state.plan.forEach(p=>{if(((p.trip||"").trim()||"__bez_nazwy__")===old)p.trip=name;});save();render();});
 document.querySelectorAll("[data-group-venue]").forEach(el=>el.onchange=()=>{const gi=+el.dataset.groupVenue;const tripGroups=[...new Set(state.plan.map(p=>(p.trip||"").trim()||"__bez_nazwy__"))],key=tripGroups[gi];state.plan.forEach(p=>{if(((p.trip||"").trim()||"__bez_nazwy__")===key){p.venue=el.value;if(el.value!=="Inne / własne łowisko")p.customVenue="";}});save();render();});
 document.querySelectorAll("[data-group-custom-venue]").forEach(el=>el.onchange=()=>{const gi=+el.dataset.groupCustomVenue;const keys=[...new Set(state.plan.map(p=>(p.trip||"").trim()||"__bez_nazwy__"))],key=keys[gi];state.plan.forEach(p=>{if(((p.trip||"").trim()||"__bez_nazwy__")===key){p.customVenue=el.value;if(el.value.trim())p.venue="Inne / własne łowisko";}});save();render();});
 document.querySelectorAll("[data-group-notes]").forEach(el=>el.onchange=()=>{const gi=+el.dataset.groupNotes;const keys=[...new Set(state.plan.map(p=>(p.trip||"").trim()||"__bez_nazwy__"))],key=keys[gi];state.plan.forEach(p=>{if(((p.trip||"").trim()||"__bez_nazwy__")===key)p.notes=el.value;});save();toast("Notatki zapisane.");});
 document.querySelectorAll("[data-add-bait-option]").forEach(el=>el.onclick=()=>{const gi=+el.dataset.addBaitOption,keys=[...new Set(state.plan.map(p=>(p.trip||"").trim()||"__bez_nazwy__"))],key=keys[gi],base=state.plan.find(p=>(((p.trip||"").trim()||"__bez_nazwy__")===key));if(!base)return;state.plan.push({recipe:"",portions:1,trip:base.trip,venue:base.venue||"",customVenue:base.customVenue||"",notes:base.notes||""});save();render();});
 document.querySelectorAll("[data-remove-trip-group]").forEach(el=>el.onclick=()=>{const gi=+el.dataset.removeTripGroup,keys=[...new Set(state.plan.map(p=>(p.trip||"").trim()||"__bez_nazwy__"))],key=keys[gi],name=key==="__bez_nazwy__"?"":key;if(!confirm(`Usunąć całą wyprawę „${name||"bez nazwy"}” wraz ze wszystkimi opcjami zanęty? Magazyn pozostanie bez zmian.`))return;state.plan=state.plan.filter(p=>(((p.trip||"").trim()||"__bez_nazwy__")!==key));save();render();toast("Wyprawa usunięta.");});
 $("#product-form")?.addEventListener("submit",e=>{e.preventDefault();const name=$("#product-name").value.trim(),grams=Number($("#product-grams").value);if(!name)return;if(Object.keys(state.stock).some(k=>k.toLocaleLowerCase("pl")===name.toLocaleLowerCase("pl"))){alert("Produkt o takiej nazwie już istnieje.");return;}state.stock[name]=Math.max(0,grams||0);save();render();toast("Produkt dodany do magazynu.");});
 document.querySelectorAll("[data-delete-product]").forEach(el=>el.onclick=()=>{const name=el.dataset.deleteProduct;const used=Object.entries(state.recipes).filter(([r,items])=>items.some(it=>it.ingredient===name)).map(([r])=>r);if(!confirm(`Usunąć produkt „${name}” z magazynu${used.length?`, a także z receptur: ${used.join(", ")}`:""}? Historia pozostanie bez zmian.`))return;delete state.stock[name];Object.keys(state.recipes).forEach(r=>state.recipes[r]=state.recipes[r].filter(it=>it.ingredient!==name));save();render();toast("Produkt usunięty.");});
 $("#add-recipe-row")?.addEventListener("click",()=>addRecipeIngredientRow());
 $("#add-recipe-new-product")?.addEventListener("click",()=>{const name=$("#recipe-new-product").value.trim(),grams=Number($("#recipe-new-grams").value);if(!name||!Number.isFinite(grams)||grams<=0){alert("Wpisz nazwę produktu i poprawną gramaturę większą od zera.");return;}const existing=Object.keys(state.stock).find(k=>k.toLocaleLowerCase("pl")===name.toLocaleLowerCase("pl"));if(existing){alert("Taki produkt już istnieje w magazynie. Wybierz go z listy składników.");return;}state.stock[name]=0;save();addRecipeIngredientRow(name,grams);$("#recipe-new-product").value="";$("#recipe-new-grams").value="";toast("Produkt dodany do magazynu i receptury.");});
 $("#recipe-form")?.addEventListener("submit",e=>{e.preventDefault();const original=$("#recipe-original").value,name=$("#recipe-name").value.trim();if(!name)return;const items=[];for(const row of document.querySelectorAll(".recipe-ingredient-row")){const ingredient=row.querySelector(".recipe-row-product").value,grams=Number(row.querySelector(".recipe-row-grams").value);if(!ingredient||!Number.isFinite(grams)||grams<=0){alert("Każdy składnik musi mieć wybrany produkt i gramaturę większą od zera.");return;}items.push({ingredient,grams});}if(!items.length){alert("Dodaj co najmniej jeden składnik.");return;}if(name!==original&&state.recipes[name]){alert("Receptura o takiej nazwie już istnieje.");return;}if(original&&original!==name){state.plan.forEach(p=>{if(p.recipe===original)p.recipe=name;});delete state.recipes[original];}state.recipes[name]=items;save();render();toast("Receptura zapisana.");});
 document.querySelectorAll("[data-edit-recipe]").forEach(el=>el.onclick=()=>{const name=el.dataset.editRecipe;$("#recipe-original").value=name;$("#recipe-name").value=name;$("#recipe-ingredient-rows").innerHTML="";(state.recipes[name]||[]).forEach(it=>addRecipeIngredientRow(it.ingredient,it.grams));$("#recipe-form-title").textContent="✎ Edytuj recepturę";$("#recipe-name").focus();window.scrollTo({top:0,behavior:"smooth"});});
 document.querySelectorAll("[data-delete-recipe]").forEach(el=>el.onclick=()=>{const name=el.dataset.deleteRecipe;if(!confirm(`Usunąć recepturę „${name}”? Pozycje planu korzystające z niej zostaną usunięte.`))return;delete state.recipes[name];state.plan=state.plan.filter(p=>p.recipe!==name);save();render();toast("Receptura usunięta.");});
 $("#recipe-cancel")?.addEventListener("click",()=>clearRecipeEditor());
 $("#clear-history")?.addEventListener("click",()=>{if(!state.history.length){toast("Historia jest już pusta.");return;}if(!confirm("Usunąć wpisy dziennika oraz listę ostatnich zakupów? Magazyn, plan i receptury pozostaną bez zmian."))return;state.history=[];state.purchases=[];save();render();toast("Wyczyszczono dziennik. Magazyn bez zmian.");});

 $("#confirm-plan")?.addEventListener("click",()=>{let plan=state.plan.filter(p=>p.recipe&&Number(p.portions)>0);if(!plan.length){toast("Plan jest pusty.");return;}let n=needForPlan(plan),short=Object.keys(n).filter(k=>n[k]>Number(state.stock[k]||0));if(short.length){alert("Nie można zatwierdzić zużycia — brakuje składników:\\n"+short.map(k=>`${k}: brakuje ${fmt(n[k]-state.stock[k])} g`).join("\\n"));return;}if(!confirm("Potwierdzasz rzeczywiste zużycie całego planu? Stany magazynowe zostaną pomniejszone."))return;let now=new Date().toLocaleString("pl-PL");plan.forEach(p=>(state.recipes[p.recipe]||[]).forEach(it=>{let grams=it.grams*Number(p.portions);state.stock[it.ingredient]-=grams;state.history.push({date:now,type:"Zużycie",description:p.trip||"Plan zanęt",ingredient:it.ingredient,grams,details:`${p.recipe} · ${fmt(p.portions)} porcji`});}));state.plan=[];save();render();toast("Zużycie zapisane, magazyn zaktualizowany.");});
 document.querySelectorAll("[data-stock]").forEach(el=>el.onchange=()=>{state.stock[el.dataset.stock]=Math.max(0,Number(el.value)||0);save();render();toast("Stan magazynowy zapisany.");});
 $("#stock-search")?.addEventListener("input",e=>{let q=e.target.value.toLocaleLowerCase("pl");document.querySelectorAll("#content tbody tr").forEach(tr=>tr.style.display=tr.textContent.toLocaleLowerCase("pl").includes(q)?"":"none");});
 document.querySelectorAll("[data-shopping-check]").forEach(el=>el.onchange=()=>{state.shoppingChecks[el.dataset.shoppingCheck]=el.checked;save();});
 document.querySelectorAll("[data-shopping-amount]").forEach(el=>el.onchange=()=>{const k=el.dataset.shoppingAmount;state.shoppingAmounts[k]=el.value;save();});
 $("#sync-shopping-amounts")?.addEventListener("click",()=>{const need=needForPlan();const missing=Object.keys(need).filter(k=>need[k]>Number(state.stock[k]||0));if(!missing.length){toast("Nie ma brakujących składników do uzupełnienia.");return;}missing.forEach(k=>{state.shoppingAmounts[k]=String(Math.max(0,need[k]-Number(state.stock[k]||0)));});save();render();toast("Ilości zakupów dopasowano do aktualnych braków.");});
  $("#reset-shopping-checks")?.addEventListener("click",()=>{state.shoppingChecks={};save();render();});
 $("#confirm-shopping")?.addEventListener("click",()=>{const rows=[...document.querySelectorAll("[data-shopping-check]:checked")];if(!rows.length){toast("Zaznacz składniki, które kupiłeś.");return;}const purchases=[];for(const el of rows){const ingredient=el.dataset.shoppingCheck;const grams=Number(state.shoppingAmounts[ingredient]??document.querySelector(`[data-shopping-amount="${CSS.escape(ingredient)}"]`)?.value);if(!Number.isFinite(grams)||grams<=0){alert(`Wpisz prawidłową ilość dla: ${ingredient}`);return;}purchases.push({ingredient,grams});}if(!confirm(`Dodać ${purchases.length} kupionych składników do magazynu i zapisać je w historii?`))return;const date=new Date().toLocaleString("pl-PL");purchases.forEach(({ingredient,grams})=>{state.stock[ingredient]=Number(state.stock[ingredient]||0)+grams;state.purchases.push({date,ingredient,grams,price:"",note:"Lista zakupów — plan wyprawy"});state.history.push({date,type:"Zakup",description:"Zakupy do planu wyprawy",ingredient,grams,details:"Dodano z listy zakupów"});delete state.shoppingChecks[ingredient];delete state.shoppingAmounts[ingredient];});save();render();toast("Kupione składniki dodane do magazynu.");});
 $("#buy-form")?.addEventListener("submit",e=>{e.preventDefault();let ingredient=$("#buy-ingredient").value,grams=Number($("#buy-grams").value);if(!ingredient||grams<=0)return;let date=new Date().toLocaleString("pl-PL"),price=$("#buy-price").value,note=$("#buy-note").value;state.stock[ingredient]=Number(state.stock[ingredient]||0)+grams;let purchase={date,ingredient,grams,price:price?`${Number(price).toFixed(2)}`:"",note};state.purchases.push(purchase);state.history.push({date,type:"Zakup",description:"Zakup składników",ingredient,grams,details:[price?`Cena: ${price} €`:"",note].filter(Boolean).join(" · ")});save();render();toast("Zakup zapisany, magazyn uzupełniony.");});
 $("#backup")?.addEventListener("click",()=>download("fishing-planet-kopia.json",JSON.stringify(state,null,2),"application/json"));
 $("#restore")?.addEventListener("click",()=>{let input=document.createElement("input");input.type="file";input.accept=".json,application/json";input.onchange=()=>{let f=input.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let imported=JSON.parse(reader.result);if(!imported.stock||!imported.recipes)throw Error();if(confirm("Import zastąpi obecne dane w tej przeglądarce. Kontynuować?")){state=imported;save();render();toast("Kopia danych zaimportowana.");}}catch(e){alert("Nieprawidłowy plik kopii.");}};reader.readAsText(f);};input.click();});
 $("#export-history")?.addEventListener("click",()=>{let rows=[["Data","Typ","Opis","Składnik","Ilość g","Szczegóły"],...state.history.map(h=>[h.date,h.type,h.description,h.ingredient,h.grams,h.details])];download("fishing-planet-historia.csv","\\ufeff"+rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(";")).join("\\r\\n"),"text/csv;charset=utf-8");});
}
function download(name,text,mime){let blob=new Blob([text],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;a.click();URL.revokeObjectURL(url);}
render();
</script>

</body></html>
