name: Optimize website images

on:
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - 'index.html'
      - '.github/workflows/optimize-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tools
        run: python -m pip install --upgrade Pillow

      - name: Create optimized WebP versions and update references
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          assets = Path("assets")
          replacements = {}

          for path in assets.rglob("*"):
              if not path.is_file() or path.suffix.lower() not in {".png", ".jpg", ".jpeg"}:
                  continue

              target = path.with_suffix(".webp")
              try:
                  with Image.open(path) as source:
                      source.load()
                      image = source
                      if image.mode not in ("RGB", "RGBA"):
                          image = image.convert("RGBA" if "transparency" in image.info else "RGB")
                      quality = 84 if path.name.lower() == "site-background.png" else 88
                      image.save(target, "WEBP", quality=quality, method=6)
                  replacements[path.as_posix()] = target.as_posix()
                  replacements[path.name] = target.name
                  print(f"Optimized copy created, original preserved: {path} -> {target}")
              except Exception as exc:
                  print(f"Skipped {path}: {exc}")

          html_path = Path("index.html")
          html = html_path.read_text(encoding="utf-8")
          for old, new in sorted(replacements.items(), key=lambda item: len(item[0]), reverse=True):
              html = html.replace(old, new)
          html_path.write_text(html, encoding="utf-8")
          PY

      - name: Commit optimized images and updated references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets index.html
          if git diff --cached --quiet; then
            echo "No image optimization changes."
            exit 0
          fi
          git commit -m "Optimize website images automatically [skip ci]"
          git push
