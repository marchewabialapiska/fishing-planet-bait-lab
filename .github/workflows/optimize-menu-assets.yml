name: Optimize menu artwork

on:
  push:
    branches: [main]
    paths:
      - 'assets/Goldener Start am Waldsee.png'
      - 'assets/Złoty planer wypraw wędkarskich.png'
      - 'assets/Magazyn zapasów nad jeziorem.png'
      - 'assets/Goldene Rezepturen am Seeufer.png'
      - 'assets/Zakupy nad jeziorem o zachodzie słońca.png'
      - 'assets/Geschichte des Angelns.png'
      - '.github/workflows/optimize-menu-assets.yml'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Convert menu art to lightweight transparent WebP
        run: |
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          files = [
              "Goldener Start am Waldsee.png",
              "Złoty planer wypraw wędkarskich.png",
              "Magazyn zapasów nad jeziorem.png",
              "Goldene Rezepturen am Seeufer.png",
              "Zakupy nad jeziorem o zachodzie słońca.png",
              "Geschichte des Angelns.png",
          ]
          assets = Path("assets")
          for name in files:
              src = assets / name
              with Image.open(src) as original:
                  image = original.convert("RGBA")
                  image.thumbnail((1000, 500), Image.Resampling.LANCZOS)
                  out = assets / (src.stem + ".webp")
                  image.save(out, "WEBP", quality=84, method=6)
                  print(f"{src.name} -> {out.name}: {image.size}, {out.stat().st_size:,} bytes")
          PY
      - name: Commit optimized assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.webp
          if git diff --cached --quiet; then
            echo "No optimized assets changed."
          else
            git commit -m "Add optimized WebP menu artwork"
            git pull --rebase origin main
            git push
          fi
